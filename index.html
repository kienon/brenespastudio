<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Brene Spa Studio</title>

  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js"></script>

  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css?family=Roboto+Slab:400,100,300,700" rel="stylesheet" />
  <link href="css/styles.css" rel="stylesheet" />

  <!-- FLOATING BUTTON STYLE -->
  <style>
    .whatsapp-float {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 999;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
  </style>
</head>

<body id="page-top">

<!-- FLOATING WHATSAPP -->
<a id="whatsappFloat"
   href="https://wa.me/60123456789?text=Hi%20Brene%20Spa%20Studio%2C%20saya%20ingin%20buat%20tempahan%20😊"
   target="_blank"
   class="btn btn-success whatsapp-float">
   <i class="fab fa-whatsapp"></i>
</a>

<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top" id="mainNav">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#page-top">Brene Spa Studio</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive">
      Menu <i class="fas fa-bars ms-1"></i>
    </button>
    <div class="collapse navbar-collapse" id="navbarResponsive">
      <ul class="navbar-nav text-uppercase ms-auto py-4 py-lg-0">
        <li class="nav-item"><a class="nav-link" href="#services">Services</a></li>
        <li class="nav-item"><a class="nav-link" href="#gallery">Gallery</a></li>
        <li class="nav-item"><a class="nav-link" href="#about">About</a></li>
        <li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Hero -->
<header class="masthead bg-dark text-light text-center" style="background:url('assets/img/gallery/13.jpg') center/cover no-repeat;">
  <div class="container">
    <div class="masthead-subheading">Welcome to</div>
    <div class="masthead-heading text-uppercase">Brene Spa Studio</div>
    <p class="lead fst-italic">Very relaxing for people to go healing</p>
    <a class="btn btn-primary btn-xl text-uppercase mt-3" href="#services">Discover Our Services</a>
  </div>
</header>

<!-- Services -->
<section class="page-section" id="services">
  <div class="container text-center">
    <h2 class="section-heading text-uppercase">Our Services</h2>
  </div>
</section>

<!-- Gallery (unchanged) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css" />

<section class="page-section bg-light" id="gallery">
  <div class="container text-center">
    <h2 class="section-heading text-uppercase">Gallery</h2>
  </div>
</section>

<!-- About -->
<section class="page-section" id="about">
  <div class="container text-center">
    <h2 class="section-heading text-uppercase">About Us</h2>
  </div>
</section>

<!-- Contact -->
<section class="page-section" id="contact">
  <div class="container text-center">

    <h2 class="section-heading text-uppercase">Find Us</h2>

    <!-- MAP -->
    <div class="ratio ratio-16x9 mb-4">
      <iframe src="https://www.google.com/maps/embed?..." loading="lazy"></iframe>
    </div>

    <!-- IMPORTANT: ADD ID HERE -->
    <a id="whatsappContactBtn"
       href="https://wa.me/60196960299?text=Hi%20Brene%20Spa%20Studio%2C%20saya%20ingin%20buat%20tempahan%20😊"
       target="_blank"
       class="btn btn-success btn-xl text-uppercase">
       <i class="fab fa-whatsapp me-2"></i> Chat & Book via WhatsApp
    </a>

  </div>
</section>

<!-- Footer -->
<footer class="footer py-4 bg-dark text-light text-center">
  <p>© 2025 Brene Spa Studio</p>
</footer>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const floatBtn = document.getElementById("whatsappFloat");
    const contactSection = document.getElementById("contact");
    const contactBtn = document.getElementById("whatsappContactBtn");

    if (!floatBtn) return;

    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                floatBtn.style.display = "none";
            } else {
                floatBtn.style.display = "flex";
            }
        });
    }, {
        threshold: 0.3
    });

    // Observe BOTH (this is the key upgrade)
    if (contactSection) observer.observe(contactSection);
    if (contactBtn) observer.observe(contactBtn);

});
</script>

</body>
</html>
